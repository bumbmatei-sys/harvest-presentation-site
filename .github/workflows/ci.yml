name: CI

# Runs on `pull_request` only. The `push: branches: [main]` trigger was removed
# in THE-170, which ran this whole workflow a second time for the commit each
# merge produced.
#
# Unlike the app repo, this one is PUBLIC, so its Actions minutes are free and
# it contributed nothing to the exhausted allowance. The change is here for the
# duplicate runs and the cancellation, not for the budget.
#
# The tradeoff is the same and worth stating here too: a `pull_request` run
# tests the PR merged into `main` as it stood when the run started. Squash-
# merging after `main` has moved lands a tree that was never tested in that
# exact form, so an older green check is not a statement about `main`. `main`
# is unprotected, so a direct push to it now gets no CI at all.

on:
  pull_request:
    branches: [main]

# One live run per pull request; superseded runs are cancelled rather than left
# to finish alongside the newest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # `build` is `tsc -b && vite-react-ssg build`: it is this repo's only
      # typecheck as well as the prerender, so it is verification, not packaging.
      - name: Build
        run: npm run build

      # Again, this time with dist/ on disk. The /faq suite reads the answers
      # out of dist/faq/index.html when the build has run and renders them
      # itself when it has not (see src/pages/FaqPage.test.ts) — the answers
      # being in the file a crawler fetches is the reason that page is
      # prerendered, so it is worth checking the file rather than a stand-in.
      - name: Re-run tests against the built output
        run: npm test
